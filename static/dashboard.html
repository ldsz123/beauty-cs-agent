<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运营数据看板 - 美妆智能客服</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #333;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 24px; }
        .header .subtitle { opacity: 0.9; font-size: 14px; margin-top: 4px; }
        .nav-tabs {
            display: flex;
            gap: 10px;
        }
        .nav-tab {
            padding: 8px 16px;
            border-radius: 6px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.2s;
        }
        .nav-tab:hover { background: rgba(255,255,255,0.3); }
        .nav-tab.active { background: rgba(255,255,255,0.3); font-weight: 600; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .metric-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        .metric-label {
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .metric-value {
            font-size: 32px;
            font-weight: 700;
            color: #333;
        }
        .metric-change {
            font-size: 13px;
            margin-top: 8px;
        }
        .metric-change.up { color: #52c41a; }
        .metric-change.down { color: #f5222d; }
        .chart-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .chart-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .chart-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 200px;
            padding: 20px 0;
        }
        .bar-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .bar {
            width: 100%;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px 4px 0 0;
            min-height: 4px;
            transition: height 0.5s;
        }
        .bar-label { font-size: 12px; color: #888; }
        .pie-chart {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .pie-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .pie-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .pie-label { flex: 1; font-size: 14px; }
        .pie-value { font-size: 14px; font-weight: 600; color: #666; }
        .table-section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        th {
            font-size: 13px;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td { font-size: 14px; }
        tr:hover td { background: #fafafa; }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-badge.success { background: #f6ffed; color: #52c41a; }
        .status-badge.warning { background: #fff7e6; color: #fa8c16; }
        .status-badge.error { background: #fff1f0; color: #f5222d; }
        .refresh-btn {
            padding: 8px 16px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .refresh-btn:hover { border-color: #667eea; color: #667eea; }
        .loading { text-align: center; padding: 40px; color: #888; }
        .error-msg { color: #f5222d; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>运营数据看板</h1>
            <div class="subtitle">美妆电商智能客服系统 · 实时业务监控</div>
        </div>
        <div class="nav-tabs">
            <a href="/" class="nav-tab">聊天界面</a>
            <a href="/dashboard" class="nav-tab active">运营看板</a>
            <button class="refresh-btn" onclick="loadAllData()">刷新数据</button>
        </div>
    </div>

    <div class="container">
        <!-- 核心指标卡片 -->
        <div class="metrics-grid" id="metricsGrid">
            <div class="metric-card">
                <div class="metric-label">今日 GMV</div>
                <div class="metric-value" id="todayGmv">--</div>
                <div class="metric-change" id="gmvChange">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">今日订单</div>
                <div class="metric-value" id="todayOrders">--</div>
                <div class="metric-change" id="orderChange">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">AI 会话数</div>
                <div class="metric-value" id="aiSessions">--</div>
                <div class="metric-change" id="sessionChange">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">AI 解决率</div>
                <div class="metric-value" id="resolutionRate">--</div>
                <div class="metric-change" id="resolutionChange">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">转人工率</div>
                <div class="metric-value" id="escalationRate">--</div>
                <div class="metric-change" id="escalationChange">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">客单价</div>
                <div class="metric-value" id="avgOrderValue">--</div>
                <div class="metric-change" id="aovChange">--</div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="chart-section">
            <div class="chart-card">
                <div class="chart-title">近7天 GMV 趋势</div>
                <div class="bar-chart" id="gmvChart">
                    <div class="loading">加载中...</div>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-title">问题分类分布</div>
                <div class="pie-chart" id="issueChart">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>

        <!-- 问题分类统计表 -->
        <div class="table-section">
            <div class="chart-title">问题分类统计（近7天）</div>
            <table>
                <thead>
                    <tr>
                        <th>问题分类</th>
                        <th>数量</th>
                        <th>占比</th>
                        <th>AI解决率</th>
                        <th>趋势</th>
                    </tr>
                </thead>
                <tbody id="issueTable">
                    <tr><td colspan="5" class="loading">加载中...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- 实时会话监控 -->
        <div class="table-section">
            <div class="chart-title">实时会话监控</div>
            <table>
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>会话ID</th>
                        <th>意图</th>
                        <th>情感</th>
                        <th>耗时</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody id="sessionTable">
                    <tr><td colspan="6" class="loading">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE = '';

        async function fetchAPI(endpoint) {
            try {
                const resp = await fetch(`${API_BASE}${endpoint}`);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                return await resp.json();
            } catch (e) {
                console.error(`API error: ${endpoint}`, e);
                return null;
            }
        }

        function formatCurrency(val) {
            if (val >= 10000) return `¥${(val / 10000).toFixed(1)}万`;
            return `¥${val.toFixed(0)}`;
        }

        function formatPercent(val) {
            return `${(val * 100).toFixed(1)}%`;
        }

        async function loadAllData() {
            await Promise.all([
                loadRealtimeStats(),
                loadDailyReport(),
                loadIssueDistribution(),
            ]);
        }

        async function loadRealtimeStats() {
            const data = await fetchAPI('/api/dashboard/realtime');
            if (!data) return;

            document.getElementById('todayGmv').textContent = formatCurrency(data.gmv || 0);
            document.getElementById('todayOrders').textContent = data.orders || 0;
            document.getElementById('aiSessions').textContent = data.ai_sessions || 0;
            document.getElementById('resolutionRate').textContent = formatPercent(data.ai_resolution_rate || 0);
        }

        async function loadDailyReport() {
            const data = await fetchAPI('/api/dashboard/daily');
            if (!data) return;

            // 更新指标卡片
            if (data.gmv) {
                document.getElementById('todayGmv').textContent = formatCurrency(data.gmv.total);
                document.getElementById('todayOrders').textContent = data.gmv.order_count;
                document.getElementById('avgOrderValue').textContent = formatCurrency(data.gmv.avg_order_value);
            }
            if (data.ai_service) {
                document.getElementById('aiSessions').textContent = data.ai_service.session_count;
                document.getElementById('resolutionRate').textContent = formatPercent(data.ai_service.resolution_rate);
                document.getElementById('escalationRate').textContent = formatPercent(data.ai_service.escalation_rate);
            }

            // 更新问题分布
            if (data.issues) {
                updateIssueChart(data.issues);
                updateIssueTable(data.issues);
            }
        }

        async function loadIssueDistribution() {
            const data = await fetchAPI('/api/dashboard/issues?days=7');
            if (!data) return;

            // 更新饼图
            const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe', '#00f2fe', '#a78bfa', '#fb923c'];
            const container = document.getElementById('issueChart');
            container.innerHTML = '';

            data.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'pie-item';
                div.innerHTML = `
                    <div class="pie-color" style="background: ${colors[i % colors.length]}"></div>
                    <div class="pie-label">${item.category}</div>
                    <div class="pie-value">${item.count} (${item.percentage.toFixed(1)}%)</div>
                `;
                container.appendChild(div);
            });

            // 更新问题统计表
            const tbody = document.getElementById('issueTable');
            tbody.innerHTML = '';
            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.category}</td>
                    <td>${item.count}</td>
                    <td>${item.percentage.toFixed(1)}%</td>
                    <td>--</td>
                    <td><span class="status-badge success">--</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateIssueChart(issues) {
            const container = document.getElementById('issueChart');
            container.innerHTML = '';
            const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe', '#00f2fe'];

            Object.entries(issues)
                .filter(([key]) => !key.endsWith('_resolved') && !key.endsWith('_ai'))
                .sort((a, b) => b[1] - a[1])
                .slice(0, 6)
                .forEach(([key, count], i) => {
                    const total = Object.values(issues).reduce((a, b) => a + b, 0);
                    const pct = (count / total * 100).toFixed(1);
                    const div = document.createElement('div');
                    div.className = 'pie-item';
                    div.innerHTML = `
                        <div class="pie-color" style="background: ${colors[i % colors.length]}"></div>
                        <div class="pie-label">${key}</div>
                        <div class="pie-value">${count} (${pct}%)</div>
                    `;
                    container.appendChild(div);
                });
        }

        function updateIssueTable(issues) {
            const tbody = document.getElementById('issueTable');
            tbody.innerHTML = '';
            const filtered = Object.entries(issues).filter(([key]) => !key.endsWith('_resolved') && !key.endsWith('_ai'));
            filtered.forEach(([key, count]) => {
                const total = filtered.reduce((a, [, v]) => a + v, 0);
                const pct = (count / total * 100).toFixed(1);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${key}</td>
                    <td>${count}</td>
                    <td>${pct}%</td>
                    <td>--</td>
                    <td><span class="status-badge success">--</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 初始化加载
        loadAllData();
        // 每30秒自动刷新
        setInterval(loadAllData, 30000);
    </script>
</body>
</html>
