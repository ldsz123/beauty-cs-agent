# Alembic 配置文件
[alembic]
# 迁移脚本路径
script_location = alembic

# 数据库 URL（覆盖环境变量中的值）
# sqlalchemy.url = driver://user:pass@localhost/dbname

# 迁移脚本文件名模板
file_template = %(year)d%(month)02d%(day)02d_%(hour)02d%(minute)02d_%(rev)s_%(slug)s

# 时区
timezone = Asia/Shanghai

# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
